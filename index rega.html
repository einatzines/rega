<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCD3F3">
<title>רגע משפחתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7FD; --card:#FFFFFF; --ink:#3E3B4F; --muted:#827E95;
  --teal:#2F6A63; --mint:#BFE6DF; --teal-l:#E6F5F2; --coral:#F4C2B5; --coral-d:#8A4535; --coral-l:#FDEEE9;
  --sun:#F7E1A6; --sun-l:#FFF7E0; --lav:#DCD3F3; --lav-l:#F1EDFB; --line:#ECE6F3; --ok:#4E9A6E; --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(180deg,#F6F1FD 0%,#FDF6F2 55%,#F2FAF8 100%) fixed;color:var(--ink);font-family:Rubik,system-ui,Arial,sans-serif;font-size:17px;line-height:1.55}
#app{max-width:520px;margin:0 auto;padding:16px 16px 90px;min-height:100vh}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
h1{font-size:30px;font-weight:800}
h2{font-size:23px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:.3em 0 .8em}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 4px 18px rgba(120,100,170,.08);margin:12px 0;border:1px solid var(--line)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;margin:10px 0;background:var(--mint);color:var(--teal);box-shadow:0 2px 0 rgba(47,106,99,.12);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--lav-l);color:#5B4E8C;box-shadow:none}
.btn.coral{background:var(--coral);color:var(--coral-d)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);font-weight:500;font-size:16px;padding:10px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>*{flex:1}
label{display:block;font-weight:500;margin:12px 0 6px}
input[type=text],input[type=password],input[type=email],textarea,select{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:#B7A9E6;box-shadow:0 0 0 3px var(--lav-l)}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{flex:1 1 auto;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;font:inherit;cursor:pointer;color:var(--ink)}
.choice button.on{border-color:#9FD3C9;background:var(--teal-l);color:var(--teal);font-weight:700}
.hero{text-align:center;padding:26px 6px 6px}
.logo{font-size:58px;line-height:1}
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;color:#6A5BA8;direction:ltr}
.chip{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--sun-l);margin:3px;font-size:15px}
.chip.me{background:var(--teal-l);color:var(--teal);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);margin-bottom:4px}
.score{background:var(--coral-l);color:var(--coral-d);border-radius:99px;padding:4px 12px;font-weight:700}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px;margin-bottom:8px}
.b-open{background:var(--sun-l);color:#8A6A1E}.b-guess{background:var(--coral-l);color:var(--coral-d)}
.b-empathy{background:var(--teal-l);color:var(--teal)}.b-puzzle{background:var(--lav-l);color:#5B4E8C}
.q{font-size:22px;font-weight:700;line-height:1.4;margin:6px 0 14px}
.ans{padding:12px 14px;border-radius:14px;background:var(--bg);margin:8px 0;border:1px solid var(--line)}
.ans b{display:block;font-size:14px;color:var(--muted);font-weight:500}
.big{font-size:20px;font-weight:700}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.feel button span{display:block;font-size:24px}
.feel button.on{border-color:#EDA996;background:var(--coral-l);font-weight:700}
.mark{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer;margin-top:6px}
.mark.on{background:var(--coral);border-color:var(--coral);color:var(--coral-d)}
.clue{background:var(--lav-l);border-radius:14px;padding:14px;margin:8px 0;font-size:19px;font-weight:500}
.wait{margin-top:10px;font-size:15px;color:var(--muted)}
.center{text-align:center}
.celebrate{font-size:54px;text-align:center;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3);opacity:0}80%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.final{background:linear-gradient(160deg,#FFFFFF,#F6F1FD 60%,#FDF0EB);border:2px solid var(--lav)}
.final h2{color:var(--teal)}
.note{background:var(--sun-l);border-radius:14px;padding:14px;margin:8px 0;font-size:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#5B4E8C;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:9;max-width:90%;text-align:center}
.demo{background:var(--sun-l);border:1px dashed #E5C877;border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:8px}
.qitem{border-bottom:1px solid var(--line);padding:10px 0}
.qitem small{color:var(--muted)}
.qitem .acts{display:flex;gap:8px;margin-top:6px}
.qitem .acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.help{background:var(--lav-l);border-radius:12px;padding:10px 14px;font-size:14px;margin:8px 0}
.checks label{display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0;font-weight:400}
</style>
</head>

})();
function makeLocalStore() {
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('fg') : null;
  const subs = {};
  const key = c => 'fg_room_' + c;
  const read = c => { try { return JSON.parse(LS.getItem(key(c))); } catch (e) { return null; } };
  const notify = c => { (subs[c] || []).forEach(fn => fn(read(c))); };
  if (bc) bc.onmessage = e => notify(e.data);
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith('fg_room_')) notify(e.key.slice(8)); });
  const write = (c, v) => { if (v === null) LS.removeItem(key(c)); else LS.setItem(key(c), JSON.stringify(v)); bc && bc.postMessage(c); setTimeout(() => notify(c), 0); };
  return {
    async createRoom(c, data) { const ex = read(c); if (ex && Date.now() - ex.createdAt < 12 * 3600e3) throw new Error('exists'); write(c, data); },
    async getRoom(c) { return read(c); },
    async update(c, patch) { const r = read(c); if (!r) throw new Error('missing'); Object.keys(patch).forEach(k => setPath(r, k, patch[k])); write(c, r); },
    subscribe(c, fn) { (subs[c] = subs[c] || []).push(fn); setTimeout(() => fn(read(c)), 0); return () => { subs[c] = (subs[c] || []).filter(f => f !== fn); }; },
    async deleteRoom(c) { write(c, null); },
    async loadQuestions() { try { return JSON.parse(LS.getItem('fg_questions')) || []; } catch (e) { return []; } },
    async saveQuestion(q) { const a = await this.loadQuestions(); const i = a.findIndex(x => x.id === q.id); if (i >= 0) a[i] = q; else a.push(q); LS.setItem('fg_questions', JSON.stringify(a)); },
    async deleteQuestion(id) { const a = (await this.loadQuestions()).filter(x => x.id !== id); LS.setItem('fg_questions', JSON.stringify(a)); },
    async seed(list) { LS.setItem('fg_questions', JSON.stringify(list)); },
    async saveSummary(s) { const a = await this.loadSummaries(); a.push(s); LS.setItem('fg_summaries', JSON.stringify(a)); },
    async loadSummaries() { try { return JSON.parse(LS.getItem('fg_summaries')) || []; } catch (e) { return []; } },
    async deleteSummary(id) { const a = (await this.loadSummaries()).filter(x => x.id !== id); LS.setItem('fg_summaries', JSON.stringify(a)); },

  };

function makeFirebaseStore() {
  firebase.initializeApp(cfg);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const rooms = db.collection('rooms');
  const qs = db.collection('questions');
  return {
    async createRoom(c, data) {
      const ref = rooms.doc(c);
      await db.runTransaction(async tx => {
        const s = await tx.get(ref);
        if (s.exists && Date.now() - (s.data().createdAt || 0) < 12 * 3600e3) throw new Error('exists');
        tx.set(ref, data);
      });
    },
    async getRoom(c) { const s = await rooms.doc(c).get(); return s.exists ? s.data() : null; },
    async update(c, patch) { await rooms.doc(c).update(patch); },
    subscribe(c, fn) { return rooms.doc(c).onSnapshot(s => fn(s.exists ? s.data() : null), () => fn(null)); },
    async deleteRoom(c) { await rooms.doc(c).delete(); },
    async loadQuestions() { const s = await qs.get(); return s.docs.map(d => d.data()); },
    async saveQuestion(q) { await qs.doc(q.id).set(q); },
    async deleteQuestion(id) { await qs.doc(id).delete(); },
    async saveSummary(s) { await db.collection('summaries').doc(s.id).set(s); },
    async loadSummaries() { const s = await db.collection('summaries').orderBy('createdAt', 'desc').limit(200).get(); return s.docs.map(d => d.data()); },
    async deleteSummary(id) { await db.collection('summaries').doc(id).delete(); },
    async seed(list) { for (let i = 0; i < list.length; i += 400) { const b = db.batch(); list.slice(i, i + 400).forEach(q => b.set(qs.doc(q.id), q)); await b.commit(); } },
    onAuth(fn) { auth.onAuthStateChanged(fn); },
    async signIn(email, pw) { await auth.signInWithEmailAndPassword(email, pw); },
    async signOut() { await auth.signOut(); }
  };
}

// ================= ניהול המשחק (טלפון המארח) =================
async function buildPlan(r) {
  const mode = S.hostSel.mode, cats = selCats(), len = S.hostSel.len;
  let bank = [];
  try { bank = await store.loadQuestions(); } catch (e) { bank = []; }
  if (!bank.length) bank = window.DEFAULT_QUESTIONS;
  bank = bank.filter(q => q && !q.hidden && (q.modes || '').includes(mode));
  const isGen = q => window.TOPICS[q.topic] && window.TOPICS[q.topic].general;
  const pool = t => {
    // שוזרים את הנושאים לסירוגין, כדי שכל נושא שנבחר יופיע במשחק
    const groups = shuffle(cats).map(c => shuffle(bank.filter(q => q.t === t && q.topic === c))).filter(g => g.length);
    const pri = [];
    for (let i = 0; groups.some(g => g[i]); i++) groups.forEach(g => { if (g[i]) pri.push(g[i]); });
    const fb = shuffle(bank.filter(q => q.t === t && isGen(q) && !pri.includes(q)));
    return pri.concat(fb);
  };
  const pools = { open: pool('open'), guess: pool('guess'), empathy: pool('empathy') };
  const used = new Set();
  const ps = shuffle(players(r));
  let ptr = 0;
  const puzzles = shuffle(window.PUZZLES);
  const plan = [];
  for (let i = 0; i < len; i++) {
    let t = SEQ[i % SEQ.length];
    let item = null;
    if (t === 'guess' || t === 'empathy') {
      for (let k = 0; k < ps.length && !item; k++) {
        const subj = ps[(ptr + k) % ps.length];
        const q = pools[t].find(q => !used.has(q.id) && (q.about === 'any' || !q.about || q.about === subj.role));
        if (q) { item = { type: t, q, subjectId: subj.id }; used.add(q.id); ptr = (ptr + k + 1) % ps.length; }
      }
      if (!item) t = 'open';
    }
    if (t === 'puzzle') {
      const z = puzzles.pop();
      if (z) {
        const clues = {}; ps.forEach(p => clues[p.id] = []);
        z.clues.forEach((c, j) => clues[ps[j % ps.length].id].push(c));
        item = { type: 'puzzle', z, clues };
      } else t = 'open';
    }
    if (t === 'open') {
      const q = pools.open.find(q => !used.has(q.id) && (!q.who || ps.some(p => p.role === q.who)));
      if (q) { used.add(q.id); item = { type: 'open', q }; }
    }
    if (item) plan.push(item);
  }
  return plan;
}

async function startGame() {
  const r = S.room;
  if (players(r).length < 2) return toast('צריך לפחות שני משתתפים');
  const plan = await buildPlan(r);
  if (!plan.length) return toast('לא נמצאו שאלות למצב הזה');
  await store.update(S.code, { status: 'playing', family: (S.hostSel.family || '').trim(), log: {}, mode: S.hostSel.mode, cats: selCats(), plan, idx: 0, phase: 'answer', answers: {}, marks: {}, hearts: {}, solved: null, score: 0 });
}

function roundPoints(r) {
  const it = r.plan[r.idx]; const a = curAns(r);
  if (it.type === 'open') return Object.values(a).filter(x => !x.skip).length;
  if (it.type === 'guess') return Object.values(r.marks || {}).filter(v => v === r.idx).length;
  if (it.type === 'empathy') {
    const real = (a[it.subjectId] && a[it.subjectId].v && a[it.subjectId].v.f) || [];
    let pts = 0;
    Object.entries(a).forEach(([pid, x]) => { if (pid !== it.subjectId && x.v && (x.v.f || []).some(f => real.includes(f))) pts++; });
    pts += Object.values(r.hearts || {}).filter(v => v === r.idx).length;
    return pts;
  }
  if (it.type === 'puzzle') return (r.solved && r.solved.r === r.idx) ? 3 : 0;
  return 0;
}

async function nextRound(skip) {
  const r = S.room;
  const add = skip ? 0 : roundPoints(r);
  const score = (r.score || 0) + add;
  const it = r.plan[r.idx];
  const rec = { i: r.idx, type: it.type, skipped: !!skip, answers: curAns(r), marks: r.marks || {}, hearts: r.hearts || {}, solved: !!(r.solved && r.solved.r === r.idx) };
  if (it.q) rec.q = it.q; if (it.subjectId) rec.subjectId = it.subjectId; if (it.z) rec.z = { answers: it.z.answers };
  const logKey = 'log.r' + r.idx;
  if (r.idx + 1 < r.plan.length) {
    await store.update(S.code, { [logKey]: rec, idx: r.idx + 1, phase: 'answer', answers: {}, marks: {}, hearts: {}, solved: null, score });
  } else {
    await store.update(S.code, { [logKey]: rec, status: 'thanks', phase: 'write', thanks: {}, answers: {}, score });
  }
  window.scrollTo(0, 0);
}

function botsFor(mode, me) {

const pick = a => a[Math.floor(Math.random() * a.length)];
const BOT_OPEN = ['ערב משחקים בסלון עם פופקורן', 'כשכולנו צוחקים יחד בארוחת שישי', 'טיול בים בשקיעה', 'שמישהו פשוט ישאל מה שלומי', 'פיצה ביתית שמכינים יחד', 'נסיעה משפחתית לצפון', 'כשסבתא מספרת סיפורים', 'לשבת יחד בלי טלפונים'];

const BOT_HELP = ['לשאול מה קרה ולהקשיב', 'חיבוק', 'להכין משהו טעים', 'לתת קצת זמן ואז לבוא לדבר', 'להגיד שזה בסדר להרגיש ככה'];
const BOT_THANKS = ['היה כיף לשחק איתך הערב 💛', 'תודה על החיוך שלך', 'אוהבים אותך מאוד', 'תודה שתמיד אפשר לדבר איתך', 'צחקתי איתך הערב המון'];
const botDone = new Set();
function botTick(r) {
  const bots = players(r).filter(p => p.bot);
  const later = (key, ms, fn) => { if (botDone.has(key)) return; botDone.add(key); setTimeout(() => { if (S.room && S.code) fn().catch(e => console.error(e)); }, ms); };
  bots.forEach((b, i) => {
    const ms = 1200 + i * 900 + Math.random() * 800;
    if (r.status === 'playing') {
      const it = r.plan[r.idx]; const k = r.idx + '|' + b.id;

      }

        const a = curAns(r);

            if (pid === b.id || !x || x.skip || Math.random() < .35) return;
            if (it.type === 'guess') patch['marks.' + pid] = r.idx;
            if (it.type === 'empathy' && x.v && x.v.h) patch['hearts.' + pid] = r.idx;

    }

      later('t|' + b.id, ms, () => store.update(S.code, { ['thanks.' + b.id]: out }));

    }

}

function viewKey(r) {

  const base = [r.status, r.idx, r.phase, mine, r.solved ? 1 : 0].join('|');
  if (r.status === 'lobby') return base + JSON.stringify(r.players) + JSON.stringify(S.hostSel);
  if (r.phase === 'reveal' || r.phase === 'read' || r.phase === 'card' || r.status === 'ended') return base + JSON.stringify([r.marks, r.hearts, r.answers, r.score, r.closing]);
  return base;
}

function renderGame() {
  const r = S.room;

  const k = viewKey(r);
  if (k === S.key) { updateWaiting(); return; }
  const scrollKeep = (S.key.split('|')[0] === k.split('|')[0] && S.key.split('|')[1] === k.split('|')[1] && S.key.split('|')[2] === k.split('|')[2]);

}

        <div class="ans" style="background:var(--teal-l);border-color:#9FD3C9"><b>מה ${esc(subj.name)} ${subj.gender === 'f' ? 'הייתה מרגישה' : 'היה מרגיש'} באמת</b><span class="big">${real && !real.skip ? esc(feelText(rf, subj.gender)) : gw(subj,'דילג','דילגה')}</span>
        ${real && real.v && real.v.h ? `<div style="margin-top:6px">מה היה עוזר: ${esc(real.v.h)}</div>` : ''}</div>` +
        players(r).filter(p => p.id !== it.subjectId).map(p => {
          const x = a[p.id]; if (!x) return `<div class="ans"><b>${esc(p.name)}</b><span class="muted">${gw(p,'לא ענה','לא ענתה')}</span></div>`;
          if (x.skip) return `<div class="ans"><b>${esc(p.name)}</b><span class="muted">${gw(p,'דילג','דילגה')}</span></div>`;
          const hit = (x.v.f || []).some(f => rf.includes(f));
          const hk = p.id; const on = (r.hearts || {})[hk] === r.idx;
          return `<div class="ans"><b>${esc(p.name)} ${hit ? '· ' + gw(p,'הרגיש נכון','הרגישה נכון') + ' ❤️' : ''}</b>${esc(feelText(x.v.f, subj.gender))}
            ${x.v.h ? `<div style="margin-top:4px">💡 ${esc(x.v.h)}</div>` : ''}
            ${isSubj && x.v.h ? `<div><button class="mark ${on ? 'on' : ''}" data-h="${hk}">${on ? '❤️ זה היה עוזר לי' : 'זה היה עוזר לי? ❤️'}</button></div>` : ''}</div>`;
        }).join('') +
        `<p class="muted">שאלה לשיחה: מתי זה קרה באמת? מה עזר אז?</p>` + hostBar('לסבב הבא', () => nextRound(false), true);
    }
  }

  if (it.type === 'puzzle') {
    const solved = r.solved && r.solved.r === r.idx;
    const myClues = (it.clues || {})[me.id] || [];
    if (r.phase === 'reveal' || solved) {
      body = solved ? `<div class="celebrate">🎉</div><h2 class="center">פתרתם יחד!</h2><p class="center big">התשובה: ${esc(it.z.answers[0])}</p><p class="center muted">${esc(r.solved.by)} ${r.solved.g === 'f' ? 'הקלידה' : 'הקליד'} את התשובה, אבל כולם תרמו</p>`
        : `<h2 class="center">התשובה הייתה: ${esc(it.z.answers[0])}</h2><p class="center muted">לא נורא, בפעם הבאה 🙂</p>`;
      body += hostBar('לסבב הבא', () => nextRound(false), true);
    } else {
      body = `<div class="q">מה אני?</div><p class="muted">כל אחד מקריא בקול את הרמזים שלו. רק ביחד אפשר לנחש!</p>
        <h3>הרמזים שלך</h3>${myClues.length ? myClues.map(c => `<div class="clue">🔎 ${esc(c)}</div>`).join('') : '<div class="clue">אין לך רמז הפעם. התפקיד שלך: לאסוף את הרמזים מכולם ולנחש!</div>'}
        ${r.trial ? players(r).filter(p => p.bot).map(p => ((it.clues || {})[p.id] || []).map(c => `<div class="clue" style="opacity:.85">🔎 <b>${esc(p.name)}:</b> ${esc(c)}</div>`).join('')).join('') : ''}
        <label>הניחוש של המשפחה</label><input type="text" id="guess" placeholder="מה התשובה?"><button class="btn coral" id="tryG">בדיקה</button>` +
        (isHost() ? `<button class="btn ghost" id="giveUp">מוותרים, תראו לנו</button>` : '');
    }
  }

  app.innerHTML = `${demoBar()}${header(r)}<div class="card"><span class="badge b-${it.type}">${TYPE_LABEL[it.type]}</span>
    ${r.phase === 'answer' && it.type !== 'puzzle' ? `<div class="muted" style="margin-top:-4px">${TYPE_HINT[it.type]}</div>` : ''}${body}</div>
    <button class="btn ghost" id="leave">יציאה מהמשחק</button>`;

  // אירועים
  const send = $('#send'), skip = $('#skip');
  if (it.type === 'open' || it.type === 'guess') {
    if (send) send.onclick = () => { const v = $('#ans').value.trim(); if (!v) return toast('כתבו משהו, או דלגו'); send.disabled = true; submit(v); };
  }
  if (it.type === 'empathy' && send) {
    const getF = bindFeel('fg');
    send.onclick = () => { const f = getF(); if (!f.length) return toast('בחרו לפחות רגש אחד'); send.disabled = true; submit({ f, h: ($('#help').value || '').trim() }); };
  }
  if (skip) skip.onclick = () => submit(null, true);
  app.querySelectorAll('.mark[data-p]').forEach(b => b.onclick = () => { const on = (r.marks || {})[b.dataset.p] === r.idx; store.update(S.code, { ['marks.' + b.dataset.p]: on ? null : r.idx }); });
  app.querySelectorAll('.mark[data-h]').forEach(b => b.onclick = () => { const on = (r.hearts || {})[b.dataset.h] === r.idx; store.update(S.code, { ['hearts.' + b.dataset.h]: on ? null : r.idx }); });
  const tg = $('#tryG');
  if (tg) {
    const tryIt = () => {
      const v = norm($('#guess').value);
      if (!v) return;
      if (it.z.answers.some(x => norm(x) === v)) store.update(S.code, { solved: { r: r.idx, by: me.name, g: me.gender } });
      else { toast('עוד לא… תשתפו עוד רמזים 🔎'); $('#guess').select(); }
    };
    tg.onclick = tryIt; $('#guess').onkeydown = e => { if (e.key === 'Enter') tryIt(); };
  }
  const gu = $('#giveUp'); if (gu) gu.onclick = () => store.update(S.code, { phase: 'reveal' });
  $('#leave').onclick = leaveMidGame;
}

async function leaveMidGame() {
  if (isHost()) { if (!(await confirmLeave())) return; await store.deleteRoom(S.code).catch(() => {}); leave(); }
  else if (await askConfirm('לצאת מהמשחק?')) leave();
}

function finalCard(r) {

// ================= סיכומים =================
function summaryRecord(r) {
  return {
    id: 's' + Date.now() + rid().slice(0, 4), createdAt: Date.now(), family: r.family || '', mode: r.mode || '', cats: r.cats || [],
    score: r.score || 0, players: r.players || {}, log: r.log || {}, thanks: r.thanks || {}, closing: r.closing || {}
  };
}
function summarySections(src, viewerId) {
  const ps = Object.entries(src.players || {}).map(([id, p]) => ({ id, ...p })).sort((a, b) => a.joinedAt - b.joinedAt);
  const PP = id => (src.players || {})[id] || { name: '?', gender: 'm' };
  const viewer = viewerId ? PP(viewerId) : null;
  const log = Object.values(src.log || {}).sort((a, b) => a.i - b.i);
  const ansTxt = (p, x) => !x ? gw(p, 'לא ענה', 'לא ענתה') : x.skip ? gw(p, 'דילג', 'דילגה') : null;
  const sections = [];
  const topics = Array.from(new Set(log.filter(l => l.q && l.q.topic).map(l => (window.TOPICS[l.q.topic] || {}).name).filter(Boolean)));

  if (viewerId) {
    const notes = Object.entries(src.thanks || {}).filter(([f]) => f !== viewerId).map(([, m]) => m[viewerId]).filter(Boolean);
    sections.push({ h: 'פתקי התודה שקיבלת', items: [{ lines: notes.length ? notes.map(n => '💌 ' + n) : ['הפעם לא הגיעו פתקים'] }] });
  } else {
    const flags = [];
    log.forEach(l => {
      const qt = l.q ? (l.type === 'open' ? g(l.q.text, 'm') : g(l.q.q, PP(l.subjectId).gender, PP(l.subjectId).name)) : '';
      if (l.skipped) flags.push(`הסבב "${qt || 'חידה'}" דולג כולו`);
      Object.entries(l.answers || {}).forEach(([pid, x]) => { if (x.skip) flags.push(`${PP(pid).name} ${gw(PP(pid), 'דילג', 'דילגה')} על: "${qt}"`); });
      if (l.type === 'empathy' && !l.skipped) {
        const real = (l.answers[l.subjectId] && l.answers[l.subjectId].v && l.answers[l.subjectId].v.f) || [];
        const others = Object.entries(l.answers).filter(([pid, x]) => pid !== l.subjectId && x.v);
        if (real.length && others.length && !others.some(([, x]) => (x.v.f || []).some(f => real.includes(f))))
          flags.push(`אף אחד לא זיהה מה ${PP(l.subjectId).name} ${gw(PP(l.subjectId), 'מרגיש', 'מרגישה')} בתרחיש: "${qt}"`);
      }
      if (l.type === 'guess' && !l.skipped && Object.values(l.marks || {}).filter(v => v === l.i).length === 0 && Object.keys(l.answers || {}).length > 1)
        flags.push(`אף ניחוש לא סומן כקרוב לתשובה של ${PP(l.subjectId).name}: "${qt}"`);
    });
    sections.push({ h: 'שווה לשים לב', items: [{ lines: flags.length ? flags : ['לא עלו דילוגים או פערים בולטים'] }] });
  }
  sections.unshift({ h: 'על מה דיברנו', items: [{ lines: [topics.length ? topics.join(' · ') : 'משחק כללי'] }] });

  const rounds = log.map(l => {
    const it = { t: '', lines: [] };
    if (l.type === 'puzzle') { it.t = `משימה משותפת: חידה (${(l.z && l.z.answers[0]) || ''})`; it.lines.push(l.solved ? 'נפתרה יחד 🎉' : 'לא נפתרה'); return it; }
    if (l.skipped && !Object.keys(l.answers || {}).length) { it.t = TYPE_LABEL[l.type]; it.lines.push('הסבב דולג'); return it; }
    if (l.type === 'open') {
      it.t = 'שיחה פתוחה: ' + g(l.q.text, viewer ? viewer.gender : 'm');
      ps.filter(p => !l.q.who || p.role === l.q.who).forEach(p => { const x = l.answers[p.id]; it.lines.push(`${p.name}: ${ansTxt(p, x) || x.v}`); });
    } else if (l.type === 'guess') {
      const s = PP(l.subjectId);
      it.t = 'מפת הלב: ' + (viewerId === l.subjectId ? g(l.q.self, s.gender) : g(l.q.q, s.gender, s.name));
      const real = l.answers[l.subjectId];
      it.lines.push(`התשובה של ${s.name}: ${ansTxt(s, real) || real.v}`);
      ps.filter(p => p.id !== l.subjectId).forEach(p => { const x = l.answers[p.id]; it.lines.push(`הניחוש של ${p.name}: ${ansTxt(p, x) || x.v}${(l.marks || {})[p.id] === l.i ? ' ❤️ קרוב' : ''}`); });
    } else if (l.type === 'empathy') {
      const s = PP(l.subjectId);
      it.t = 'בנעליים של: ' + (viewerId === l.subjectId ? g(l.q.self, s.gender) : g(l.q.q, s.gender, s.name));
      const real = l.answers[l.subjectId]; const rf = (real && real.v && real.v.f) || [];
      it.lines.push(`מה ${s.name} ${gw(s, 'הרגיש', 'הרגישה')}: ${ansTxt(s, real) || feelText(rf, s.gender)}${real && real.v && real.v.h ? ' · מה היה עוזר: ' + real.v.h : ''}`);
      ps.filter(p => p.id !== l.subjectId).forEach(p => {
        const x = l.answers[p.id]; const t = ansTxt(p, x);
        if (t) return it.lines.push(`${p.name}: ${t}`);
        const hit = (x.v.f || []).some(f => rf.includes(f));
        it.lines.push(`${p.name} ${gw(p, 'חשב', 'חשבה')}: ${feelText(x.v.f, s.gender)}${hit ? ' ✓' : ''}${x.v.h ? ' · רעיון לעזרה: ' + x.v.h + ((l.hearts || {})[p.id] === l.i ? ' ❤️' : '') : ''}`);
      });
    }
    return it;
  });
  sections.push({ h: 'השאלות והתשובות', items: rounds });

  if (!viewerId) {
    const byTo = {};
    Object.values(src.thanks || {}).forEach(m => Object.entries(m || {}).forEach(([to, t]) => { (byTo[to] = byTo[to] || []).push(t); }));
    sections.push({ h: 'פתקי תודה (בלי שם הכותב)', items: ps.map(p => ({ t: 'ל' + p.name, lines: (byTo[p.id] || ['לא נכתבו פתקים']).map(t => '💌 ' + t) })) });
  }
  sections.push({
    h: 'מה לקחנו מהערב', items: ps.map(p => {
      const c = (src.closing || {})[p.id];
      return { t: p.name, lines: c ? [c.a && 'רגע ש' + gw(p, 'אני לוקח', 'אני לוקחת') + ' איתי: ' + c.a, c.b && 'מה נעשה יחד השבוע: ' + c.b, c.c && 'רעיון לבילוי החודשי: ' + c.c].filter(Boolean) : [gw(p, 'לא כתב', 'לא כתבה')] };
    })
  });
  const ideas = ps.map(p => (src.closing || {})[p.id]).filter(c => c && c.c).map(c => '🗓️ ' + c.c);
  if (ideas.length) sections.push({ h: 'רעיונות לבילוי המשפחתי החודשי', items: [{ lines: ideas }] });
  const date = new Date(src.createdAt || Date.now()).toLocaleDateString('he-IL');
  const meta = `${date} · ${MODES[src.mode] || ''}${catsLabel(src.cats) ? ' · ' + catsLabel(src.cats) : ''} · ❤️ ${src.score || 0} נקודות משפחתיות`;
  const title = viewerId ? `הסיכום האישי של ${PP(viewerId).name}` : `סיכום משחק: ${src.family || 'משפחה ללא שם'}`;
  const who = ps.map(p => `${p.name} (${p.role === 'parent' ? (p.gender === 'f' ? 'אמא' : 'אבא') : (p.gender === 'f' ? 'ילדה' : 'ילד')})`).join(', ');
  return { title, meta, who, sections };
}
function summaryHtml(src, viewerId) {
  const s = summarySections(src, viewerId);
  return `<div class="card final"><h2>${esc(s.title)}</h2><div class="muted">${esc(s.meta)}</div><div class="muted">משתתפים: ${esc(s.who)}</div>
    ${s.sections.map(sec => `<h3 style="margin-top:16px">${esc(sec.h)}</h3>${sec.items.map(it => `<div class="ans">${it.t ? `<div style="font-weight:700;margin-bottom:4px">${esc(it.t)}</div>` : ''}${it.lines.map(l => `<div>${esc(l)}</div>`).join('')}</div>`).join('')}`).join('')}</div>`;
}
function summaryText(src, viewerId) {
  const s = summarySections(src, viewerId);
  const out = [s.title, s.meta, 'משתתפים: ' + s.who, ''];
  s.sections.forEach(sec => { out.push('*' + sec.h + '*'); sec.items.forEach(it => { if (it.t) out.push('• ' + it.t); it.lines.forEach(l => out.push((it.t ? '   ' : '') + l)); }); out.push(''); });
  out.push('נוצר במשחק "' + (window.GAME_NAME || 'רגע משפחתי') + '"');
  return out.join('\n');
}
function downloadText(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/plain;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function renderEnded(r) {
  const mine = summaryText(r, S.me.id);
  app.innerHTML = `${demoBar()}<div class="card center"><p class="big">תודה ששיחקתם יחד 🫶</p><p class="muted">${r.trial ? 'זה היה משחק ניסיון, ולכן הסיכום הכללי לא נשמר.' : 'הסיכום הכללי נשלח למנחה.'} כאן למטה הסיכום האישי שלך: ${S.me.gender === 'f' ? 'שמרי' : 'שמור'} אותו לפני שסוגרים את הדף.</p>
    <button class="btn" id="share">שמירה או שליחה (וואטסאפ, מייל)</button><button class="btn sec" id="dl">הורדה כקובץ</button></div>
    ${summaryHtml(r, S.me.id)}
    <button class="btn sec" id="again">משחק חדש</button>`;
  $('#share').onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title: 'הסיכום שלי', text: mine }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(mine); toast('הסיכום הועתק. אפשר להדביק בוואטסאפ או במייל'); } catch (e) { toast('לא הצלחנו להעתיק, נסו להוריד כקובץ'); }
  };
  $('#dl').onclick = () => downloadText('הסיכום-שלי.txt', mine);
  $('#again').onclick = async () => { if (await askConfirm('לצאת? הסיכום האישי ייסגר. כדאי לשמור אותו קודם.')) leave(); };
}

// ================= מסך המנחה =================
let adminList = [];
function renderAdmin() {
  S.view = 'admin';
  store.onAuth(user => {
    if (location.hash !== '#admin') return;
    if (!user) return adminLogin();
    adminHome(user);
  });
}
function adminLogin() {
  app.innerHTML = `<h2>כניסת מנחה</h2><p class="muted">ניהול מאגר השאלות</p>
    <label>מייל</label><input type="email" id="em" dir="ltr"><label>סיסמה</label><input type="password" id="pw" dir="ltr">
    <button class="btn" id="go">כניסה</button><button class="btn ghost" id="back">חזרה למשחק</button>`;
  $('#back').onclick = () => { location.hash = ''; };
  $('#go').onclick = async () => { try { await store.signIn($('#em').value.trim(), $('#pw').value); } catch (e) { toast('המייל או הסיסמה לא נכונים'); } };
}
async function adminHome(user) {
  if (!DEMO && window.ADMIN_EMAIL && (user.email || '').toLowerCase() !== window.ADMIN_EMAIL.toLowerCase()) {
    app.innerHTML = `<div class="card"><p>החשבון ${esc(user.email)} לא מורשה לערוך שאלות.</p><button class="btn sec" id="out">יציאה</button></div>`;
    $('#out').onclick = () => store.signOut(); return;
  }
  app.innerHTML = `<p class="muted center">טוען…</p>`;
  try { adminList = await store.loadQuestions(); } catch (e) { adminList = []; toast('לא הצלחנו לטעון את המאגר'); }
  const f = adminHome.f || (adminHome.f = { t: '', topic: '' });
  const list = adminList.filter(q => (!f.t || q.t === f.t) && (!f.topic || q.topic === f.topic));
  const topicOpts = Object.entries(window.TOPICS).map(([k, t]) => `<option value="${k}" ${f.topic === k ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  app.innerHTML = `${demoBar()}<div class="top"><span>מסך המנחה</span><button class="btn ghost" id="back" style="width:auto;margin:0">חזרה למשחק</button></div>
    <div class="choice" style="margin-bottom:8px"><button class="on">מאגר השאלות</button><button id="tabSum">סיכומי משחקים</button></div>
    ${!adminList.length ? `<div class="card"><p>המאגר שלך עוד ריק, אז המשחק משתמש במאגר ההתחלה (${window.DEFAULT_QUESTIONS.length} שאלות).</p>
      <p class="muted">כדי לערוך או להוסיף שאלות, טעני קודם את מאגר ההתחלה. אחר כך כל שינוי שלך ייכנס למשחק.</p>
      <button class="btn" id="seed">טעינת מאגר ההתחלה</button></div>` : `
    <button class="btn coral" id="add">+ שאלה חדשה</button>
    <div class="row"><select id="ft"><option value="">כל הסוגים</option>${['open', 'guess', 'empathy'].map(t => `<option value="${t}" ${f.t === t ? 'selected' : ''}>${TYPE_LABEL[t]}</option>`).join('')}</select>
    <select id="ftopic"><option value="">כל הנושאים</option>${topicOpts}</select></div>
    <div class="card"><div class="muted">${list.length} שאלות</div>
    ${list.map(q => `<div class="qitem" style="${q.hidden ? 'opacity:.5' : ''}"><div>${esc(q.t === 'open' ? q.text : q.q)}</div>
      <small>${TYPE_LABEL[q.t]} · ${esc((window.TOPICS[q.topic] || {}).name || q.topic)} · ${(q.modes || '').split('').map(m => MODES[m]).join(', ')}${q.about && q.about !== 'any' ? ' · על ' + (q.about === 'parent' ? 'הורה' : 'ילד או ילדה') : ''}${q.who ? ' · עונים רק ' + WHO_LABEL[q.who] : ''}${q.hidden ? ' · מוסתרת' : ''}</small>
      <div class="acts"><button data-e="${q.id}">עריכה</button><button data-h="${q.id}">${q.hidden ? 'הצגה' : 'הסתרה'}</button><button data-d="${q.id}">מחיקה</button></div></div>`).join('')}</div>`}
    ${DEMO ? '' : '<button class="btn ghost" id="out">יציאה מהחשבון</button>'}`;
  $('#back').onclick = () => { location.hash = ''; };
  $('#tabSum').onclick = () => adminSummaries(user);
  const out = $('#out'); if (out) out.onclick = () => store.signOut();
  const seed = $('#seed'); if (seed) seed.onclick = async () => { seed.disabled = true; await store.seed(window.DEFAULT_QUESTIONS); toast('המאגר נטען'); adminHome(user); };
  const add = $('#add'); if (add) add.onclick = () => editQuestion(null, user);
  const ft = $('#ft'); if (ft) ft.onchange = e => { f.t = e.target.value; adminHome(user); };
  const ftp = $('#ftopic'); if (ftp) ftp.onchange = e => { f.topic = e.target.value; adminHome(user); };
  app.querySelectorAll('[data-e]').forEach(b => b.onclick = () => editQuestion(adminList.find(q => q.id === b.dataset.e), user));
  app.querySelectorAll('[data-h]').forEach(b => b.onclick = async () => { const q = adminList.find(q => q.id === b.dataset.h); q.hidden = !q.hidden; await store.saveQuestion(q); adminHome(user); });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => { if (!(await askConfirm('למחוק את השאלה?'))) return; await store.deleteQuestion(b.dataset.d); adminHome(user); });
}
async function adminSummaries(user, openId) {
  app.innerHTML = `<p class="muted center">טוען…</p>`;
  let list = [];
  try { list = await store.loadSummaries(); } catch (e) { console.error(e); toast('לא הצלחנו לטעון את הסיכומים'); }
  list.sort((a, b) => b.createdAt - a.createdAt);
  const open = openId && list.find(x => x.id === openId);
  if (open) {
    const txt = summaryText(open, null);
    app.innerHTML = `${demoBar()}<button class="btn ghost" id="backL" style="width:auto">→ לכל הסיכומים</button>${summaryHtml(open, null)}
      <button class="btn" id="copy">העתקת הסיכום</button><button class="btn sec" id="dl">הורדה כקובץ</button><button class="btn ghost" id="del">מחיקת הסיכום</button>`;
    $('#backL').onclick = () => adminSummaries(user);
    $('#copy').onclick = async () => { try { await navigator.clipboard.writeText(txt); toast('הועתק'); } catch (e) { toast('לא הצלחנו להעתיק'); } };
    $('#dl').onclick = () => downloadText(`סיכום-${open.family || 'משפחה'}-${new Date(open.createdAt).toLocaleDateString('he-IL').replace(/\./g, '-')}.txt`, txt);
    $('#del').onclick = async () => { if (!(await askConfirm('למחוק את הסיכום לצמיתות?'))) return; await store.deleteSummary(open.id); adminSummaries(user); };
    return;
  }
  app.innerHTML = `${demoBar()}<div class="top"><span>מסך המנחה</span><button class="btn ghost" id="back" style="width:auto;margin:0">חזרה למשחק</button></div>
    <div class="choice" style="margin-bottom:8px"><button id="tabQ">מאגר השאלות</button><button class="on">סיכומי משחקים</button></div>
    <div class="card">${list.length ? list.map(x => `<div class="qitem" style="cursor:pointer" data-o="${x.id}"><b>${esc(x.family || 'משפחה ללא שם')}</b>
      <div><small>${new Date(x.createdAt).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })} · ${esc(MODES[x.mode] || '')} · ${Object.values(x.players || {}).map(p => esc(p.name)).join(', ')}</small></div></div>`).join('')
      : '<p class="muted">עוד אין סיכומים. אחרי שמשפחה תסיים משחק, הסיכום יופיע כאן.</p>'}</div>`;
  $('#back').onclick = () => { location.hash = ''; };
  $('#tabQ').onclick = () => adminHome(user);
  app.querySelectorAll('[data-o]').forEach(el => el.onclick = () => adminSummaries(user, el.dataset.o));
}
function editQuestion(q, user) {
  const n = q ? Object.assign({}, q) : { id: 'c' + Date.now(), t: 'open', topic: 'pc', modes: 'psf', about: 'any', text: '', q: '', self: '' };
  const draw = () => {
    app.innerHTML = `<h2>${q ? 'עריכת שאלה' : 'שאלה חדשה'}</h2>
    <label>סוג</label><div class="choice" id="t">${['open', 'guess', 'empathy'].map(t => `<button data-v="${t}" class="${n.t === t ? 'on' : ''}">${TYPE_LABEL[t]}</button>`).join('')}</div>
    <div class="help">${n.t === 'open' ? 'שאלה שכולם עונים עליה. הנוסח מותאם למי שקורא.' : n.t === 'guess' ? 'שאלה על אחד המשתתפים. כולם מנחשים, והוא עונה על עצמו.' : 'תרחיש שקורה לאחד המשתתפים. כולם מנחשים איך הוא מרגיש.'}<br>
    כתבי <b>{ש}</b> במקום שם המשתתף, ו-<b>[זכר|נקבה]</b> למילים שמשתנות לפי לשון הפנייה. למשל: [אוהב|אוהבת].</div>
    ${n.t === 'open' ? `<label>השאלה</label><textarea id="text">${esc(n.text)}</textarea>
       <label>מי עונה?</label><select id="who"><option value="">כולם</option><option value="parent">רק ההורים</option><option value="child">רק הילדים</option></select>` :
      `<label>הנוסח שכולם רואים (על {ש})</label><textarea id="qq">${esc(n.q)}</textarea>
       <label>הנוסח שהמשתתף עצמו רואה (בגוף שני)</label><textarea id="self">${esc(n.self)}</textarea>
       <label>על מי השאלה יכולה להיות?</label><select id="about"><option value="any">כל אחד</option><option value="parent">רק הורה</option><option value="child">רק ילד או ילדה</option></select>`}
    <label>נושא</label><select id="topic">${Object.entries(window.TOPICS).map(([k, t]) => `<option value="${k}">${esc(t.name)}${t.general ? ' (מאגר כללי)' : ''}</option>`).join('')}</select>
    <label>מתאים למצבים</label><div class="checks">${Object.entries(MODES).map(([k, v]) => `<label><input type="checkbox" value="${k}" ${n.modes.includes(k) ? 'checked' : ''}> ${v}</label>`).join('')}</div>
    <div class="card" id="prev"></div>
    <button class="btn" id="save">שמירה</button><button class="btn ghost" id="cancel">ביטול</button>`;
    const ab = $('#about'); if (ab) ab.value = n.about || 'any';
    const wh = $('#who'); if (wh) wh.value = n.who || '';
    $('#topic').value = n.topic;
    const read = () => {
      if ($('#text')) n.text = $('#text').value; if ($('#qq')) n.q = $('#qq').value; if ($('#self')) n.self = $('#self').value;
      if (ab) n.about = ab.value; if (wh) n.who = wh.value; n.topic = $('#topic').value;
      n.modes = Array.from(app.querySelectorAll('.checks input:checked')).map(i => i.value).join('');
    };
    const prev = () => {
      read();
      const p = $('#prev');
      p.innerHTML = '<b>תצוגה מקדימה</b>' + (n.t === 'open'
        ? `<div class="ans"><b>לבן</b>${esc(g(n.text, 'm'))}</div><div class="ans"><b>לבת</b>${esc(g(n.text, 'f'))}</div>`
        : `<div class="ans"><b>על יואב</b>${esc(g(n.q, 'm', 'יואב'))}</div><div class="ans"><b>על נועה</b>${esc(g(n.q, 'f', 'נועה'))}</div><div class="ans"><b>נועה רואה</b>${esc(g(n.self, 'f'))}</div>`);
    };
    app.querySelectorAll('textarea,select,input').forEach(el => el.oninput = el.onchange = prev);
    prev();
    $('#t').querySelectorAll('button').forEach(b => b.onclick = () => { read(); n.t = b.dataset.v; draw(); });
    $('#cancel').onclick = () => adminHome(user);
    $('#save').onclick = async () => {
      read();
      if (n.t === 'open' ? !n.text.trim() : (!n.q.trim() || !n.self.trim())) return toast('חסר נוסח לשאלה');
      if (n.t !== 'open' && !n.q.includes('{ש}')) return toast('בנוסח שכולם רואים צריך להופיע {ש}');
      if (!n.modes) return toast('בחרי לפחות מצב אחד');
      const clean = { id: n.id, t: n.t, topic: n.topic, modes: n.modes, hidden: !!n.hidden };
      if (n.t === 'open') { clean.text = n.text.trim(); if (n.who) clean.who = n.who; } else { clean.q = n.q.trim(); clean.self = n.self.trim(); clean.about = n.about || 'any'; }
      try { await store.saveQuestion(clean); toast('נשמר'); adminHome(user); } catch (e) { console.error(e); toast('השמירה נכשלה'); }
    };
  };
  draw();
}

// ================= ניתוב =================
function route() {
  if (location.hash === '#admin') return renderAdmin();
  if (S.code && S.me) return; // כבר במשחק
  renderHome();
}
window.addEventListener('hashchange', () => { if (location.hash !== '#admin' && S.code && S.me) { S.key = ''; renderGame(); } else route(); });

// חזרה למשחק אחרי רענון
try {
  let sv = null; try { sv = JSON.parse(sessionStorage.getItem('fg_me') || 'null'); } catch (e) {}
  if (!sv) sv = JSON.parse(LS.getItem('fg_me') || 'null');
  if (sv && Date.now() - (sv.t || 0) > 12 * 3600e3) sv = null;
  if (sv && sv.me && sv.code) { S.me = sv.me; S.code = sv.code; connect(); }
} catch (e) {}
document.title = window.GAME_NAME || document.title;
if (!(S.code && S.me) || location.hash === '#admin') route();
})();

</script>
</body>
</html>
